name: KeyDock
configs:
  Debug: debug
  Release: release
  DebugPreview: debug
  ReleasePreview: release
  DebugDesktopReview: debug
  ReleaseDesktopReview: release
options:
  bundleIdPrefix: com.arthurwangwsx
  deploymentTarget:
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    MACOSX_DEPLOYMENT_TARGET: '14.0'
    CODE_SIGN_IDENTITY: '-'
    CODE_SIGN_STYLE: Manual
packages:
  KeyDockModules:
    path: .
targets:
  KeyDock:
    type: application
    platform: macOS
    sources: [Apps/KeyDock/Sources, Apps/KeyDock/Resources]
    dependencies:
      - package: KeyDockModules
        product: WorkbenchFeature
      - package: KeyDockModules
        product: MacAdapters
      - package: KeyDockModules
        product: KeyDockUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arthurwangwsx.KeyDock
        PRODUCT_NAME: KeyDock
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: KeyDock
        INFOPLIST_KEY_NSAppleEventsUsageDescription: Control explicitly selected applications and open selected commands in Terminal.
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_DEBUG_DYLIB: NO
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        DebugPreview:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) KEYDOCK_PREVIEW
          PRODUCT_NAME: KeyDockPreview
          PRODUCT_BUNDLE_IDENTIFIER: com.arthurwangwsx.KeyDock.preview
          INFOPLIST_KEY_CFBundleDisplayName: KeyDock Preview
        ReleasePreview:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) KEYDOCK_PREVIEW
          PRODUCT_NAME: KeyDockPreview
          PRODUCT_BUNDLE_IDENTIFIER: com.arthurwangwsx.KeyDock.preview
          INFOPLIST_KEY_CFBundleDisplayName: KeyDock Preview
        DebugDesktopReview:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) KEYDOCK_DESKTOP_REVIEW
          PRODUCT_NAME: KeyDockDesktopReview
          PRODUCT_BUNDLE_IDENTIFIER: com.arthurwangwsx.KeyDock.desktopreview
          INFOPLIST_KEY_CFBundleDisplayName: KeyDock Desktop Review
        ReleaseDesktopReview:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) KEYDOCK_DESKTOP_REVIEW
          PRODUCT_NAME: KeyDockDesktopReview
          PRODUCT_BUNDLE_IDENTIFIER: com.arthurwangwsx.KeyDock.desktopreview
          INFOPLIST_KEY_CFBundleDisplayName: KeyDock Desktop Review
    scheme:
      testTargets: []
